apiVersion: v1
kind: Service
metadata:
  name: ecommerce-frontend-service
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ecommerce.frontend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    {{- include "ecommerce.frontend.selectorLabels" . | nindent 4 }}
  ports:
  - name: tcp
    port: {{ .Values.frontend.service.port }}
    targetPort: {{ .Values.frontend.service.port }}
    protocol: TCP
