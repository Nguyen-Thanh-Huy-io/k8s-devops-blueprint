apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-backend-configmap
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ecommerce.backend.labels" . | nindent 4 }}
data:
  application.properties: |
    spring.datasource.url=jdbc:mysql://${MARIADB_HOST}:${MARIADB_PORT}/${MARIADB_DB}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    spring.datasource.username=${MARIADB_NAME}
    spring.datasource.password=${MARIADB_PASSWORD}
    spring.datasource.driverClassName={{ .Values.backend.config.datasource.driverClassName }}

    spring.datasource.sql-script-encoding=UTF-8
    spring.jpa.properties.hibernate.globally_quoted_identifiers=true
    spring.jpa.hibernate.ddl-auto={{ .Values.backend.config.jpa.ddlAuto }}
    spring.jpa.show-sql={{ .Values.backend.config.jpa.showSql }}
    spring.jpa.properties.hibernate.format_sql=true

    spring.jpa.properties.hibernate.dialect={{ .Values.backend.config.jpa.dialect }}
    spring.data.rest.base-path={{ .Values.backend.config.dataRest.basePath }}
    allowed.origins={{ .Values.backend.config.allowedOrigins }}
    spring.data.rest.detection-strategy={{ .Values.backend.config.dataRest.detectionStrategy }}
    okta.oauth2.client-id={{ .Values.backend.config.okta.clientId }}
    okta.oauth2.issuer={{ .Values.backend.config.okta.issuer }}

    # Actuator - Health Probes for Kubernetes
    management.endpoints.web.exposure.include=health
    management.endpoint.health.show-details=always
    management.endpoint.health.probes.enabled=true
    management.health.livenessState.enabled=true
    management.health.readinessState.enabled=true
