apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ecommerce-backend-servicemonitor
  namespace: ecommerce
  labels:
    release: thanhhuyvn-kube-prometheus
spec:
  selector:
    matchLabels:
      app: ecommerce-backend 
  endpoints:
  - port: http 
    path: /actuator/prometheus
    interval: 15s