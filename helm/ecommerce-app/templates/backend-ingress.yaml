{{- if .Values.backend.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecommerce-backend-ingress
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ecommerce.backend.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.backend.ingress.tls.enabled }}
    cert-manager.io/cluster-issuer: {{ .Values.certManager.clusterIssuer.name | quote }}
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    {{- end }}
spec:
  ingressClassName: nginx
  {{- if .Values.backend.ingress.tls.enabled }}
  tls:
  - hosts:
    - {{ .Values.backend.ingress.host }}
    secretName: {{ .Values.backend.ingress.tls.secretName }}
  {{- end }}
  rules:
  - host: {{ .Values.backend.ingress.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ecommerce-backend-service
            port:
              number: {{ .Values.backend.service.port }}
{{- end }}
