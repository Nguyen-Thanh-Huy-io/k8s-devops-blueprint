name: CI Pipeline - Build, Test & Push Images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/ecommerce-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/ecommerce-frontend

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "sha_tag=${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "🏷️ Image tag: ${SHA_SHORT}"

      # --- BACKEND: BUILD -> SCAN -> PUSH ---
      - name: Build Backend Image (Local)
        uses: docker/build-push-action@v6
        with:
          context: ./ecommerce-app/backend
          file: ./ecommerce-app/backend/Dockerfile
          load: true # Nạp image vào local runner
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.sha_tag }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Trivy Scan Backend Image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: '${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.sha_tag }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Backend Image
        run: |
          docker push ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.sha_tag }}
          docker push ${{ env.BACKEND_IMAGE }}:latest

      # --- FRONTEND: BUILD -> SCAN -> PUSH ---
      - name: Build Frontend Image (Local)
        uses: docker/build-push-action@v6
        with:
          context: ./ecommerce-app/frontend
          file: ./ecommerce-app/frontend/Dockerfile
          load: true # Nạp image vào local runner
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.sha_tag }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Trivy Scan Frontend Image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: '${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.sha_tag }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Frontend Image
        run: |
          docker push ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.sha_tag }}
          docker push ${{ env.FRONTEND_IMAGE }}:latest

      # --- CẬP NHẬT GITOPS: ĐỔI TAG TRONG HELM VALUES.YAML ---
      - name: Update Helm values.yaml with new image tag
        if: github.event_name == 'push'
        run: |
          sed -i "s|tag: \".*\"|tag: \"${{ steps.meta.outputs.sha_tag }}\"|g" helm/ecommerce-app/values.yaml || \
          sed -i "s|tag: .*|tag: ${{ steps.meta.outputs.sha_tag }}|g" helm/ecommerce-app/values.yaml

      - name: Commit and push updated Helm values
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/ecommerce-app/values.yaml
          git diff --staged --quiet || (git commit -m "ci: update helm image tag to ${{ steps.meta.outputs.sha_tag }}" && git push)