apiVersion: v1
data:
  application.properties: |
    spring.datasource.url=jdbc:mysql://${MARIADB_HOST}:${MARIADB_PORT}/${MARIADB_DB}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    spring.datasource.username=${MARIADB_NAME}
    spring.datasource.password=${MARIADB_PASSWORD}
    spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

    spring.datasource.sql-script-encoding=UTF-8
    spring.jpa.properties.hibernate.globally_quoted_identifiers=true
    spring.jpa.hibernate.ddl-auto=none
    spring.jpa.show-sql=true
    spring.jpa.properties.hibernate.format_sql=true

    spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
    spring.data.rest.base-path=/api
    allowed.origins=http://ecommerce.thanhhuy.vn
    spring.data.rest.detection-strategy=ANNOTATED
