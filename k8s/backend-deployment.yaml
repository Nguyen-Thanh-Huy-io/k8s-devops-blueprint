apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-backend-deployment
  namespace: ecommerce
  labels:
    app: ecommerce-backend
spec:
  selector:
    matchLabels:
      app: ecommerce-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: ecommerce-backend
    spec:
      containers:
      - name: ecommerce-backend
        image: huyhuy0210/ecommerce-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: tcp
          protocol: TCP
        # Startup probe: cho phép Spring Boot đủ thời gian khởi động
        # (failureThreshold × periodSeconds = 30 × 10 = 300s tối đa)
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 30
        # Readiness probe: kiểm tra app sẵn sàng nhận traffic
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
          successThreshold: 1
        # Liveness probe: phát hiện app bị treo → restart container
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
          failureThreshold: 3
          successThreshold: 1
        envFrom:
        - secretRef:
            name: ecommerce-backend-database-connection
            optional: false
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 1028Mi
        volumeMounts:
        - name: ecommerce-backend-application-properties-config-volume
          mountPath: /run/src/main/resources/application.properties
          subPath: application.properties
      volumes:
      - name: ecommerce-backend-application-properties-config-volume
        configMap:
          name: ecommerce-backend-application-properties-configmap
          defaultMode: 420