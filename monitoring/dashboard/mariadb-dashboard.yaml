apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-mariadb-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  mariadb.json: |-
    {
      "annotations": { "list": [] },
      "editable": true,
      "panels": [
        {
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "id": 1,
          "title": "Database Active Connections",
          "type": "timeseries",
          "targets": [
            {
              "datasource": { "type": "prometheus" },
              "expr": "mysql_global_status_threads_connected",
              "legendFormat": "Active Connections"
            }
          ]
        },
        {
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "id": 2,
          "title": "Slow Queries Count",
          "type": "timeseries",
          "targets": [
            {
              "datasource": { "type": "prometheus" },
              "expr": "rate(mysql_global_status_slow_queries[5m])",
              "legendFormat": "Slow Queries / sec"
            }
          ]
        }
      ],
      "refresh": "10s",
      "schemaVersion": 38,
      "tags": ["ecommerce", "database"],
      "time": { "from": "now-1h", "to": "now" },
      "timezone": "browser",
      "title": "Ecommerce Database - MariaDB Overview"
    }