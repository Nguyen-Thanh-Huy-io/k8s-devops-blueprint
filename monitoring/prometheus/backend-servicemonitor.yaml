apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ecommerce-backend-servicemonitor
  namespace: monitoring
  labels:
    release: thanhhuyvn-kube-prometheus
spec:
  selector:
    matchLabels:
      app: ecommerce-backend  # Trùng với label trong Service của Backend
  namespaceSelector:
    matchNames:
      - ecommerce            # Namespace chứa Pod Backend
  endpoints:
  - port: tcp
    path: /actuator/prometheus
    interval: 15s