apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ingress-traffic-alerts
  namespace: monitoring
  labels:
    release: thanhhuyvn-kube-prometheus
spec:
  groups:
  - name: ingress-traffic.rules
    rules:
    # Tỷ lệ lỗi HTTP 5xx của Ingress Nginx vượt quá 5% trong 5 phút
    - alert: NginxHighHttp5xxRate
      expr: sum(rate(nginx_ingress_controller_requests{status=~"5.*"}[5m])) / sum(rate(nginx_ingress_controller_requests[5m])) * 100 > 5
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Tỷ lệ lỗi 5xx tăng cao trên Ingress"
        description: "Hệ thống đang trả về hơn 5% response dạng HTTP 5xx trong 5 phút qua."